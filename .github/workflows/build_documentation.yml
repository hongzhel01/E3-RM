name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

env:
  TRL_EXPERIMENTAL_SILENCE: 1

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@08317becb911e145c7f36d06605d53e0647bcd86  # main
    with:
      commit_sha: ${{ github.sha }}
      package: trl
      version_tag_suffix: ""
      python_version: "3.13"
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
