[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "e3-rm"
version = "0.1.0.dev0"
description = "E3-RM reward-model research and language-model post-training tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["e3_rm/licenses/Apache-2.0.txt"]
keywords = ["reward-model", "post-training", "sft", "dpo", "kto", "grpo", "rloo", "distillation"]
dependencies = [
    "accelerate>=1.11.0",
    "datasets>=4.7.0",
    "huggingface_hub>=0.34.0",
    "jinja2",
    "numpy>=1.26.0",
    "packaging>20.0",
    "pandas>=2.1.1",
    "psutil>=5.9.4",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.1",
    "torch>=2.6.0",
    "transformers>=4.56.2",
]

[project.urls]
Repository = "https://github.com/hongzhel01/E3-RM"

[project.scripts]
e3-rm = "e3_rm.cli:main"

[project.optional-dependencies]
deepspeed = [
    "deepspeed>=0.18.6",
    "transformers!=5.1.0",
]
kernels = [
    "transformers[kernels]",
    "transformers[hub-kernels]",
]
liger = [
    "liger-kernel>=0.8.2",
]
math_verify = [
    "math-verify>=0.8.0",
]
peft = [
    "peft>=0.17.0",
]
quantization = [
    "bitsandbytes>=0.45.2",
]
test = [
    "pytest-cov",
    "pytest-datadir>=1.7.0",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist",
    "pytest",
]
vllm = [
    "vllm>=0.22.0,<0.33.0",
    "aiohttp>=3.13.3",
    "requests",
]
vlm = [
    "Pillow",
    "torchvision",
    "num2words==0.5.14",
]
dev = ["pytest", "pytest-datadir>=1.7.0", "pytest-xdist", "ruff", "build"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["e3_rm*"]
exclude = ["tests*"]
namespaces = true

[tool.setuptools.package-data]
e3_rm = ["py.typed", "templates/*.md", "chat_templates/*.jinja", "accelerate_configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["invariant: training-invariant checks (run explicitly under tests/invariant)"]
norecursedirs = ["tests/invariant", ".venv", "build", "dist"]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:The argument 'device' of Tensor.pin_memory:DeprecationWarning",
    "ignore:The argument 'device' of Tensor.is_pinned:DeprecationWarning",
    "ignore:_check_is_size will be removed in a future PyTorch release:FutureWarning",
    "ignore:AnnAssign.__init__ missing 1 required positional argument:DeprecationWarning",
    "ignore:torch.get_autocast_gpu_dtype\\(\\) is deprecated:DeprecationWarning",
    "ignore:inner dimension \\(\\d+\\) is not aligned for fast kernel:UserWarning",
    "ignore:__array_wrap__ must accept context and return_scalar arguments:DeprecationWarning",
    "ignore:TensorFloat32 tensor cores for float32 matrix multiplication available but not enabled:UserWarning",
    "ignore:Position ids are not supported for parameter efficient tuning:UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 119
src = ["e3_rm"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "T", "C"]
ignore = ["B028", "C408", "C901", "E501"]

[tool.ruff.lint.per-file-ignores]
"e3_rm/cli/**.py" = ["T201"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["e3_rm"]
